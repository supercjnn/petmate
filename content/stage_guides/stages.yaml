# 宠护90天阶段定义

## 阶段划分

### S0: 接猫准备期
- **天数范围**: Day -14 ~ 0 (接猫前2周)
- **核心目标**: 准备用品和环境，降低接猫当天混乱
- **用户焦虑**: 不知道买什么、怕买错、怕准备不足
- **关键行动**: 
  - 采购必需品清单
  - 布置安全空间
  - 了解猫咪来源信息
  - 预约体检时间

### S1: 适应期
- **天数范围**: Day 1 ~ 3
- **核心目标**: 降低应激，建立安全感
- **用户焦虑**: 猫躲着、不吃东西、不亲人
- **关键行动**:
  - 保持安静环境
  - 固定食物水源位置
  - 远距离观察
  - 不强行互动

### S2: 信任建立期
- **天数范围**: Day 4 ~ 14
- **核心目标**: 建立稳定喂食、排泄和互动节奏
- **用户焦虑**: 猫还是不亲人、不知道怎么互动
- **关键行动**:
  - 建立喂食时间规律
  - 开始轻微互动尝试
  - 观察排泄习惯
  - 引入简单玩具

### S3: 行为塑造期
- **天数范围**: Day 15 ~ 30
- **核心目标**: 建立抓挠、玩耍、作息等基础行为习惯
- **用户焦虑**: 猫抓家具、半夜闹、乱尿
- **关键行动**:
  - 确立猫抓板使用
  - 建立玩耍-进食-睡眠节奏
  - 开始剪指甲训练
  - 习惯日常护理接触

### S4: 稳定护理期
- **天数范围**: Day 31 ~ 60
- **核心目标**: 完成护理节奏、疫苗驱虫计划和用品优化
- **用户焦虑**: 疫苗时间、驱虫频率、用品更换
- **关键行动**:
  - 完成核心疫苗
  - 建立驱虫节奏
  - 优化用品选择
  - 建立健康观察习惯

### S5: 长期优化期
- **天数范围**: Day 61 ~ 90
- **核心目标**: 形成长期养猫系统，优化健康、行为和环境
- **用户焦虑**: 长期怎么养、要不要绝育
- **关键行动**:
  - 绝育决策规划
  - 长期饮食优化
  - 环境丰富化
  - 建立完整养猫习惯系统

---

## 阶段内容要素

每个阶段的内容必须包含：

```yaml
StageContent:
  stage_id: string        # 如 "S1"
  stage_name: string      # 如 "适应期"
  core_goal: string       # 一句话核心目标
  day_range: string       # 如 "Day 1-3"
  common_user_anxiety:    # 用户常见焦虑点
    - string
  daily_actions:          # 该阶段每日共性行动
    - string
  daily_avoids:           # 该阶段每日共性禁忌
    - string
  risk_signals:           # 该阶段需重点关注的信号
    - string
  shopping_guidance:      # 该阶段用品建议
    - string
  transition_criteria:    # 进入下一阶段的条件
    - string
```

## 风险等级定义

| 级别 | 含义 | 语调 | 示例 |
|------|------|------|------|
| low | 当前属于常见现象，正常观察即可 | 安抚型 | "到家前3天躲藏较常见，继续观察" |
| medium | 需要加强观察，设定观察窗口 | 谨慎型 | "腹泻超过24小时应加强观察" |
| high | 建议尽快咨询兽医或线下检查 | 明确提醒 | "超过48小时完全不进食，建议尽快联系兽医" |
| urgent | 可能存在紧急风险，建议立即就医 | 严肃直接 | "呼吸异常属于高风险信号，建议立即就医" |
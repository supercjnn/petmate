## 组合判断逻辑

当多个条件同时出现时，风险等级可能叠加：

```python
def evaluate_risk(status, day_number):
    # 紧急优先
    if status.breathing_abnormal:
        return RiskResult("urgent", "呼吸异常建议立即就医")
    
    if status.no_urination and status.no_urination_hours >= 24:
        return RiskResult("urgent", "无法排尿需立即就医")
    
    # 高风险
    if status.eating == "none" and status.eating_none_hours >= 48:
        return RiskResult("high", "超过48小时不进食需尽快就医")
    
    # 中等风险 - 组合条件
    if status.vomiting and status.sneezing_frequent:
        return RiskResult("medium", "呕吐伴随呼吸道症状需关注")
    
    # 低风险 - 适应期特殊情况
    if day_number <= 3 and status.hiding == "always" and status.eating != "none":
        return RiskResult("low", "适应期躲藏正常，继续观察")
    
    # 默认
    return RiskResult("low", "当前暂无明显高风险信号")
```


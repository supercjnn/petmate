# 常见猫咪品种特性数据

## 品种分类

### 短毛品种

#### 英国短毛猫 (British Shorthair)
- 性格: 温和、独立、不粘人
- 适应期: 较长，需要更多空间
- 特殊注意: 易胖，需控制饮食
- 行动卡调整: Day 4-7 增加互动训练
- 推荐活动量: 中等

#### 美国短毛猫 (American Shorthair)
- 性格: 友善、活泼、适应力强
- 适应期: 较短
- 特殊注意: 无特殊要求
- 行动卡调整: 标准流程
- 推荐活动量: 中高

#### 中华田园猫 (Chinese Domestic)
- 性格: 独立、聪明、适应力强
- 适应期: 最短
- 特殊注意: 无特殊要求，健康管理为主
- 行动卡调整: 可加快进度
- 推荐活动量: 高

#### 俄罗斯蓝猫 (Russian Blue)
- 性格: 害羞、敏感、粘主人
- 适应期: 较长
- 特殊注意: 容易应激，环境变化需缓慢
- 行动卡调整: Day 1-7 减少打扰频率
- 推荐活动量: 中低

---

### 长毛品种

#### 波斯猫 (Persian)
- 性格: 温和、安静、需要陪伴
- 适应期: 中等
- 特殊注意: 毛发护理重点，眼部清洁
- 行动卡调整: Day 15+ 增加毛发护理模块
- 推荐活动量: 低

#### 布偶猫 (Ragdoll)
- 性格: 温顺、粘人、爱跟随
- 适应期: 较短（依赖性强）
- 特殊注意: 心脏健康监测
- 行动卡调整: Day 1-3 增加陪伴时间
- 推荐活动量: 中低

#### 缅因猫 (Maine Coon)
- 性格: 温和、活泼、亲人
- 适应期: 中等
- 特殊注意: 需要大空间，心脏监测
- 行动卡调整: Day 30+ 增加互动游戏
- 推荐活动量: 高

#### 金吉拉 (Chinchilla)
- 性格: 温和、安静、爱撒娇
- 适应期: 中等
- 特殊注意: 毛发护理，眼部清洁
- 行动卡调整: Day 15+ 毛发护理重点
- 推荐活动量: 中

---

### 特殊品种

#### 暹罗猫 (Siamese)
- 性格: 活泼、话多、粘人
- 适应期: 较短
- 特殊注意: 需要大量互动，容易叫
- 行动卡调整: Day 4+ 增加互动训练
- 推荐活动量: 高

#### 无毛猫 (Sphynx)
- 性格: 活泼、粘人、需要保暖
- 适应期: 较短
- 特殊注意: 皮肤护理，保暖
- 行动卡调整: Day 1+ 增加皮肤清洁
- 推荐活动量: 中高

#### 折耳猫 (Scottish Fold)
- 性格: 温和、安静、粘人
- 适应期: 中等
- 特殊注意: 关节健康监测（遗传风险）
- 行动卡调整: Day 30+ 增加关节监测提醒
- 推荐活动量: 低中

---

## 品种适配规则

### 适应期调整
| 品种类型 | Day 1-3 调整 |
|----------|-------------|
| 敏感型（俄蓝、折耳） | 减少打扰频率，观察间隔延长 |
| 依赖型（布偶、暹罗） | 增加陪伴时间，可提前互动 |
| 独立型（英短、田园） | 给更多空间，不强求互动 |
| 标准型 | 按原流程执行 |

### 护理重点调整
| 品种类型 | 特殊护理时机 |
|----------|-------------|
| 长毛型（波斯、布偶） | Day 15+ 增加毛发护理模块 |
| 无毛型 | Day 1+ 皮肤清洁，保暖提醒 |
| 易胖型（英短） | Day 30+ 饮食控制提醒 |
| 关节风险型（折耳） | Day 30+ 关节健康监测 |

### 活动量建议
| 活动等级 | 玩具推荐 | 互动频率 |
|----------|----------|----------|
| 高（缅因、暹罗、田园） | 逗猫棒、跑轮 | 每天2-3次 |
| 中高（美短、无毛） | 逗猫棒、激光笔 | 每天1-2次 |
| 中（金吉拉、布偶） | 小球、羽毛 | 每天1次 |
| 低（波斯、俄蓝） | 静态玩具 | 每2天1次 |

---

## 个性化逻辑

```
用户选择品种后：
1. 获取品种特性数据
2. 计算适应期系数 (0.5-2.0)
3. 调整 Day 1-7 行动卡内容
4. 添加品种特殊护理模块
5. 调整活动量建议
6. 添加健康监测提醒（如有遗传风险）
```
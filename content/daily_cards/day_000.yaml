day_number: 0
stage_name: 接猫准备期
title: 准备迎接小家伙
focus: 备齐用品，布置安全的小空间
actions:
  - text: 准备一个独立小房间或大笼子作为"第一周居所"
    reason: 新到家需要安全感，空间太大反而让它不安
  - text: 买好猫粮，问清楚之前吃的是什么牌子
    reason: 突然换粮容易拉肚子，先保持一致
  - text: 准备猫砂盆和猫砂，放在安静角落
    reason: 猫需要隐私，位置选不好它可能不用
  - text: 准备水碗和饭碗，陶瓷或不锈钢材质
    reason: 塑料碗容易滋生细菌，还可能导致下巴黑头
  - text: 准备一个躲避用的纸箱或猫窝
    reason: 猫需要"藏身处"来建立安全感
avoids:
  - text: 不要买太多玩具和零食
    reason: 第一周重点是适应环境，不是娱乐
  - text: 不要用香水、香薰、消毒液清洁房间
    reason: 猫嗅觉敏感，化学气味可能造成不适
observe:
  - 检查窗户是否有纱窗或防护网
  - 确认电线、小物件已收纳好
risk_tip: 接猫前确认已完成驱虫和基础疫苗（问卖家要记录），没有记录也没关系，到家后尽快安排体检
shopping_tip: 最低配置清单：猫粮、猫砂+猫砂盆、水碗、饭碗、躲避屋/纸箱。其他都可以慢慢添置
reassurance: 不用追求完美，猫咪适应能力比你想象的强，准备个安全小空间就够了
followup_questions:
  - 你知道猫咪之前吃什么牌子的猫粮吗？
  - 房间窗户做好防护了吗？
day_number: 24
stage_name: 行为塑造期
title: 指甲护理第二步：露出指甲
focus: 学习正确地按出猫咪指甲
actions:
  - text: 在猫咪接受触摸后，轻轻按压爪垫上方
    reason: 让指甲自然伸出
  - text: 练习时只按出指甲，不进行任何剪的动作
    reason: 分步骤让猫咪适应每个环节
  - text: 每只爪子按一下就给奖励
    reason: 建立积极的指甲露出体验
avoids:
  - text: 不要强行拉扯猫咪爪子
    reason: 会造成紧张和抵触
  - text: 不要在猫咪反抗时继续练习
    reason: 保持每次练习的正面体验
observe:
  - 指甲露出的难易程度
  - 猫咪对按压的反应
  - 是否能顺利接触每个爪子
risk_tip: 如果猫咪挣扎，立即停止并转移注意力，改天再继续
shopping_tip: 现在可以选购适合猫咪的指甲剪（推荐小号剪刀式），但先不使用
reassurance: 慢慢来，这一步做好了，真正剪指甲时会顺利很多。不要着急进入下一步。
followup_questions:
  - 能顺利让猫咪露出指甲吗？
  - 猫咪对这一步的接受程度如何？

day_number: 57
stage_name: 稳定护理期
title: 应急预案建立
focus: 为突发情况做好准备
actions:
  - text: 记录宠物医院急诊电话和地址
    reason: 紧急情况时快速找到专业帮助
  - text: 准备基础的应急用品包
    reason: 小伤口或突发情况可以临时处理
  - text: 学习识别需要紧急就医的情况
    reason: 知道什么时候该去医院
avoids:
  - text: 不要自行处理严重外伤或中毒
    reason: 非专业处理可能加重问题
  - text: 不要在紧急时才找医院信息
    reason: 提前准备能争取宝贵时间
observe:
  - 家里是否有潜在的危险因素
  - 是否知道最近的宠物医院在哪
risk_tip: 中毒、严重外伤、呼吸困难、持续呕吐腹泻等情况需立即就医
shopping_tip: 应急包可包含：碘伏、纱布、止血粉、伊丽莎白圈
reassurance: 有备无患，提前准备让你在紧急时刻更冷静！
followup_questions:
  - 知道最近的宠物医院在哪里吗？
  - 有没有遇到过需要紧急处理的情况？

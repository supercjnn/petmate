day_number: 1
stage_name: 适应期
title: 小家伙到家第一天
focus: 给它空间，减少打扰，让它自己探索
actions:
  - text: 把猫放在准备好的小空间里，打开航空箱门，然后离开
    reason: 不要强行抱出来，让它自己决定什么时候出来
  - text: 放好水、粮、猫砂盆，然后假装忙自己的事
    reason: 你的存在感太强，它反而不敢动
  - text: 说话声音放轻，动作放慢
    reason: 大声说话和快动作会让猫紧张
  - text: 如果它躲在角落不出来，假装没看见
    reason: 盯着它看在猫的语言里是威胁
avoids:
  - text: 不要强行抱它、摸它、追着它跑
    reason: 强行互动会破坏信任，应激反应会更严重
  - text: 不要让朋友、家人来围观
    reason: 陌生人只会增加压力
  - text: 不要大声喊它的名字或拍手叫它
    reason: 它还不知道那是它的名字，只会觉得吵
observe:
  - 有没有喝水、吃东西
  - 有没有用猫砂盆
  - 是躲着不动，还是已经开始探索
risk_tip: 如果24小时完全不吃不喝，或出现呕吐、拉稀，联系之前的卖家或准备就医
shopping_tip: 如果猫粮还没买对牌子，尽快网购或去宠物店买同款，临时可以用羊奶粉过渡
reassurance: 第一天不吃不喝很正常，它只是太紧张了，给它时间
followup_questions:
  - 猫咪出来探索了吗？还是还在躲着？
  - 有看到它喝水或吃东西吗？
day_number: 31
stage_name: 稳定护理期
title: 疫苗规划启动日
focus: 了解猫咪疫苗时间表，做好接种准备
actions:
  - text: 查阅猫咪疫苗本，确认已接种疫苗和下次接种时间
    reason: 掌握疫苗进度是稳定护理的基础
  - text: 了解猫三联和狂犬疫苗的区别与重要性
    reason: 帮助你理解每针疫苗的作用
  - text: 选择合适的宠物医院，提前预约接种时间
    reason: 避免临时匆忙，确保按时接种
avoids:
  - text: 不要在猫咪身体不适时安排疫苗接种
    reason: 免疫力低下时接种可能影响效果或加重不适
  - text: 不要跳过疫苗本上的记录
    reason: 完整记录是未来就医的重要参考
observe:
  - 疫苗本上的接种记录是否完整
  - 猫咪目前的健康状态是否适合接种
risk_tip: 如果猫咪有流鼻涕、拉稀、精神萎靡等症状，需等康复后再接种
shopping_tip: 准备一个专用的疫苗记录文件夹或APP记录接种时间
reassurance: 疫苗是保护猫咪健康的重要防线，提前规划让你更有掌控感。
followup_questions:
  - 你知道猫咪下一针疫苗是什么时候吗？
  - 有没有固定的宠物医院？

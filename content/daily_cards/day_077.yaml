    reason: 防护网很重要
  - text: 不要把窗户全部遮挡
    reason: 猫咪喜欢观察外界
observe:
  - 猫咪是否喜欢待在窗边
  - 观景时的行为表现
risk_tip: 高层需安装防护网
shopping_tip: 可放置猫窝或吊床在窗边
reassurance: 窗户是猫咪的"电视节目"
followup_questions:
  - 您家的窗户情况如何？
  - 有没有安装防护措施？
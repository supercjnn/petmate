day_number: 25
stage_name: 行为塑造期
title: 指甲护理第三步：首次剪甲
focus: 尝试剪掉1-2个指甲
actions:
  - text: 选择猫咪最放松的时刻（如餐后小憩时）
    reason: 增加成功概率
  - text: 只剪掉1-2个指甲的尖端，避开粉红色部分
    reason: 控制风险，建立信心
  - text: 每剪一个就给奖励，完成后结束练习
    reason: 保持正面体验
avoids:
  - text: 绝对不要剪到指甲里的粉红色部分（血线）
    reason: 会出血疼痛，造成恐惧
  - text: 不要试图一次剪完所有指甲
    reason: 首次只需体验成功
observe:
  - 猫咪对指甲剪的声音反应
  - 剪后是否有舔舐或检查行为
  - 整体配合程度
risk_tip: 万一剪到血线出血，用止血粉或干净棉球按压止血，并暂停当天的训练
shopping_tip: 选择带LED灯的指甲剪，方便看清血线位置
reassurance: 第一次只要成功剪掉一个就是胜利！慢慢来，你可以的，猫咪也可以的。
followup_questions:
  - 第一次剪指甲进展如何？
  - 猫咪的反应在你的预期之内吗？

day_number: 4
stage_name: 信任建立期
title: 建立喂食节奏
focus: 固定每日喂食时间和地点，让猫建立安全感
actions:
  - text: 确定每日固定的喂食时间（建议早晚各一次）
    reason: 规律的喂食时间让猫有可预期的生活节奏
  - text: 每次喂食前轻声呼唤它的名字
    reason: 帮助它建立名字与好事（食物）的关联
  - text: 选择固定的喂食地点，不要频繁更换
    reason: 固定的地点让猫感到安全可控
  - text: 喂食时可以在旁边安静坐着，不主动靠近
    reason: 让它习惯你在旁边却不打扰它吃饭
avoids:
  - text: 不要用手直接喂食
    reason: 可能会被误伤，也影响它建立独立进食习惯
  - text: 不要频繁更换猫粮品牌或口味
    reason: 突然换粮容易导致肠胃不适
  - text: 不要在它吃饭时盯着看或拍照
    reason: 被盯着看会让猫感到压力
observe:
  - 喂食后多久能吃完？
  - 是否按时等待下一顿？
  - 有没有挑食、剩饭的情况？
risk_tip: 如果完全不吃或只吃很少，且精神萎靡，需要警惕
shopping_tip: 可以准备一个定时喂食器，帮助你保持规律
reassurance: 四天了，规律的生活正在帮助它建立安全感，每一点坚持都在起作用
followup_questions:
  - 每次能吃完吗？还是会有剩余？
  - 饭盆旁边有没有吃剩的残渣？

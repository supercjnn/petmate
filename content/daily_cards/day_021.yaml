day_number: 21
stage_name: 行为塑造期
title: 调整喂食时间
focus: 通过喂食时间引导作息规律
actions:
  - text: 将最后一餐时间固定在晚上8-9点左右
    reason: 配合你休息时间，让猫咪餐后自然休息
  - text: 早上起床后第一时间喂食
    reason: 建立清晨进食而非玩闹的期待
  - text: 保持每天喂食时间相对固定（误差30分钟内）
    reason: 帮助猫咪建立稳定的生物钟
avoids:
  - text: 不要在半夜回应猫咪的叫唤喂食
    reason: 会强化夜间活动的习惯
  - text: 不要因为忙碌而打乱喂食时间
    reason: 作息调整需要一致性
observe:
  - 猫咪对固定喂食时间的适应程度
  - 夜间是否减少了索食行为
  - 早上是否等待你喂食而非直接闹腾
risk_tip: 如果猫咪半夜叫唤，可以放少量干粮在碗里，但不要在那时正餐喂食
shopping_tip: 定时喂食器可以帮助你在固定时间投放食物，保持规律
reassurance: 慢慢来，作息调整需要2-3周才能稳定。坚持是关键，小进步也是进步。
followup_questions:
  - 猫咪是否开始适应新的喂食时间？
  - 夜间叫唤的情况有改善吗？

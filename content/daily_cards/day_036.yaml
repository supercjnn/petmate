day_number: 36
stage_name: 稳定护理期
title: 驱虫知识入门
focus: 了解猫咪驱虫的重要性和基本知识
actions:
  - text: 学习猫咪常见寄生虫：蛔虫、绦虫、球虫、滴虫
    reason: 了解敌人才能有效防御
  - text: 区分体内驱虫和体外驱虫的不同
    reason: 两种驱虫方式和频率不同
  - text: 查阅猫咪驱虫记录，确认上次驱虫时间
    reason: 建立驱虫节奏的前提
avoids:
  - text: 不要使用狗狗驱虫药给猫咪
    reason: 成分和剂量不同，可能中毒
  - text: 不要忽视室内猫的驱虫需求
    reason: 虫卵可能通过鞋底、生肉等途径进入
observe:
  - 猫咪粪便是否正常
  - 有无频繁磨屁股的行为
risk_tip: 定期驱虫是预防猫咪健康问题的重要措施，不可忽视
shopping_tip: 咨询医生后选择适合的驱虫药品牌，体内体外分开购买
reassurance: 了解驱虫知识，才能更好地保护猫咪健康。继续加油！
followup_questions:
  - 你知道猫咪上次驱虫是什么时候吗？
  - 有没有发现过猫咪粪便里有虫？

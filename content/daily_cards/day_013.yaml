day_number: 13
stage_name: 信任建立期
title: 建立信任呼叫
focus: 让名字成为温馨的信号，增进互动连接
actions:
  - text: 每次喂食、玩耍或抚摸前，轻声呼唤它的名字
    reason: 名字+好事=名字是对它的召唤，建立正向联想
  - text: 用不同的语调测试它的反应（温柔/活泼）
    reason: 了解它对哪种叫法有更好回应
  - text: 当它回应你的呼唤时，给予奖励（食物/抚摸）
    reason: 强化"叫我名字=好事发生"的条件反射
  - text: 避免用名字说"不"或批评的话
    reason: 名字应该只和正面体验关联
avoids:
  - text: 不要大声喊它的名字
    reason: 会吓到它，建立负面联想
  - text: 不要重复不停叫名字
    reason: 会变成背景噪音失去意义
  - text: 不要在生气或紧张时叫它
    reason: 你的情绪会影响它的反应
observe:
  - 叫名字时它有反应吗？（耳朵动、抬头、看过来）
  - 用什么语调叫它回应最积极？
  - 有没有开始向你的方向走来？
risk_tip: 如果完全不回应名字或任何声音，需要检查听力是否正常
shopping_tip: 可以准备一些响片，用于训练时配合名字使用（可选）
reassurance: 十三天了，名字正在变成一种纽带，它开始知道"我的名字"和"我的家人"之间的联系
followup_questions:
  - 叫名字时猫咪有什么反应？
  - 它能记住自己的名字吗？

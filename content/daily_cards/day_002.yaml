day_number: 2
stage_name: 适应期
title: 保持距离，观察状态
focus: 继续给它空间，同时观察吃喝拉撒是否正常
actions:
  - text: 早上检查猫砂盆，确认有没有大小便
    reason: 排泄正常=身体状态OK，第一天没拉也正常
  - text: 补充水粮，动作轻缓，不要盯着它看
    reason: 你的任务就是"存在但不打扰"
  - text: 如果它愿意靠近你，保持不动让它闻
    reason: 闻你是猫在认识你，不是在求摸
  - text: 可以在小空间外轻声说话，让它习惯你的声音
    reason: 声音熟悉了=安全感建立中
avoids:
  - text: 不要因为它看起来"不怕人"就强行抱它
    reason: 主动靠近≠接受抱抱，信任要一步步来
  - text: 不要换粮、换砂、换环境
    reason: 任何改变都是压力源，保持稳定最重要
  - text: 不要用手逗它玩
    reason: 会养成咬手的坏习惯，以后很难改
observe:
  - 今天有没有吃东西？（比昨天多还是少）
  - 大便形态正常吗？（成形、不稀、不带血）
  - 愿意在你在场的时候活动吗？
risk_tip: 如果两天完全没吃没喝没拉，或者大便稀软带血，建议尽快就医或咨询医生
shopping_tip: 这几天重点是观察，不需要买新东西。如果猫砂盆太小或位置不对，可以调整
reassurance: 第二天还是躲着也没关系，有的猫胆子小，给它一周时间都正常
followup_questions:
  - 猫砂盆里有大小便了吗？
  - 猫咪今天的状态比昨天放松一点了吗？
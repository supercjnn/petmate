day_number: 8
stage_name: 信任建立期
title: 引入简单玩具
focus: 用玩具建立互动，释放它的玩耍本能
actions:
  - text: 准备逗猫棒或羽毛玩具，在它能看见的地方轻轻晃动
    reason: 玩具可以激发捕猎本能，转移对陌生环境的紧张
  - text: 模仿猎物移动（忽快忽慢、偶尔隐藏）
    reason: 不规则的移动方式最能吸引猫的注意
  - text: 每次玩耍时间5-10分钟即可，不要过长
    reason: 短时间高效玩耍，避免疲劳和失去兴趣
  - text: 它抓到玩具后，给予口头夸奖
    reason: 正面反馈让它更愿意玩耍
avoids:
  - text: 不要用激光笔（红点）
    reason: 猫抓不到会让它沮丧和焦虑
  - text: 不要用手、脚当玩具让猫扑咬
    reason: 会养成咬人的坏习惯
  - text: 不要强迫它参与玩耍
    reason: 不玩可能是它还没准备好，不要施压
observe:
  - 它会追着玩具移动眼球吗？
  - 会尝试扑、抓的动作吗？
  - 玩耍后有舔毛、放松的表现吗？
risk_tip: 玩耍时注意不要让猫吞食玩具零件，如羽毛、小零件等
shopping_tip: 推荐简单的逗猫棒、羽毛杆、毛绒老鼠等基础玩具
reassurance: 玩耍是猫释放压力的方式，它愿意玩就是对你和环境的信任
followup_questions:
  - 猫咪对家具有兴趣吗？还是完全不理会玩具？
  - 有没有尝试扑抓的动作？

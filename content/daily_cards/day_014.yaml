day_number: 14
stage_name: 信任建立期
title: 信任建立期总结
focus: 巩固两周来的成果，展望下一阶段
actions:
  - text: 回顾这两周：喂食规律、排泄正常、互动进展
    reason: 两周复盘，看到进步，建立信心
  - text: 总结它喜欢和不喜欢的事（食物偏好、抚摸位置、玩耍方式）
    reason: 了解猫咪的"喜好地图"有助于未来相处
  - text: 记录它独特的性格特点（怕什么、爱什么、什么让它放松）
    reason: 每只猫性格不同，这份记录很宝贵
  - text: 尝试主动靠近它坐下，不强迫互动
    reason: 主动靠近但给予空间是最成熟的陪伴方式
avoids:
  - text: 不要认为"它该完全信任我了"
    reason: 猫的信任是无上限的，永远保持尊重
  - text: 不要跳过任何已建立的习惯（喂食、清理、玩耍）
    reason: 一致性是信任的基石
  - text: 不要着急，信任建立期可能还需要延续
    reason: 每只猫节奏不同，尊重它的步调
observe:
  - 两周前和现在，它有什么明显变化？
  - 它在大部分时间是放松的还是警觉的？
  - 它对你主动靠近的反应？
risk_tip: 如果两周后有倒退（突然躲藏、不吃饭），可能是健康问题或压力来源
shopping_tip: 可以考虑为下一阶段添置猫爬架，让它有更多活动空间
reassurance: 两周，十四天。从陌生到开始熟悉，从害怕到开始靠近。你的耐心，它感受得到。信任不是终点，是每一天的选择
followup_questions:
  - 回顾这两周，你觉得最自豪的进展是什么？
  - 有没有什么需要特别记录的猫咪特点？

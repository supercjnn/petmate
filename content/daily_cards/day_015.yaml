day_number: 15
stage_name: 行为塑造期
title: 猫抓板初体验
focus: 让猫咪认识并开始使用猫抓板
actions:
  - text: 将猫抓板放在猫咪经常活动的地方
    reason: 方便猫咪随时使用
  - text: 用猫薄荷或玩具在抓板上摩擦，吸引注意
    reason: 激发猫咪探索和抓挠兴趣
  - text: 观察猫咪抓挠方向，调整抓板位置和角度
    reason: 符合猫咪自然抓挠习惯
avoids:
  - text: 不要把猫咪强行按到抓板上
    reason: 会产生负面联想，适得其反
  - text: 不要在猫咪抓家具时大声呵斥
    reason: 可能让猫咪更紧张，加剧抓挠行为
observe:
  - 猫咪是否主动靠近猫抓板
  - 抓挠的频率和时间
  - 更喜欢竖抓还是横抓
risk_tip: 如果猫咪完全不理会抓板，不要着急，可能需要尝试不同材质（瓦楞纸、剑麻、地毯）
shopping_tip: 建议准备2-3个不同材质的猫抓板，方便后续观察猫咪偏好
reassurance: 猫咪抓挠是天性，不是故意捣乱。给它合适的抓挠出口，家具就能得到保护。
followup_questions:
  - 猫咪有没有尝试过抓挠猫抓板？
  - 更喜欢哪种类型的抓板（材质/形状）？

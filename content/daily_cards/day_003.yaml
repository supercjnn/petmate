day_number: 3
stage_name: 适应期
title: 尝试温和互动
focus: 如果状态稳定，可以开始建立信任
actions:
  - text: 如果它愿意靠近，伸出手指让它闻，不要主动摸
    reason: 闻是猫的社交方式，让主动权在它手里
  - text: 如果它蹭你，可以尝试轻轻摸头或下巴
    reason: 蹭你是信任的信号，可以从安全区域开始
  - text: 可以在小空间里陪它坐一会儿，刷手机或看书
    reason: 你的存在=陪伴，不需要刻意互动
  - text: 继续检查吃喝拉撒是否正常
    reason: 身体健康是第一位的
avoids:
  - text: 不要摸肚子、尾巴、爪子
    reason: 这些是猫的敏感部位，容易触发防御反应
  - text: 不要强行把它从躲藏处拉出来
    reason: 躲避是它的安全机制，不要破坏
  - text: 不要在它吃饭、上厕所的时候摸它
    reason: 这些时候被打扰会让猫焦虑
observe:
  - 猫咪会不会主动走向你？
  - 有没有发出呼噜声？（有的话是好事）
  - 耳朵位置正常吗？（耳朵向后压=紧张或害怕）
risk_tip: 三天不吃不喝必须就医；如果出现打喷嚏、流眼泪、眼睛分泌物多，可能是呼吸道感染
shopping_tip: 如果猫咪开始活跃，可以考虑添置一个逗猫棒（但先不要用激光笔）
reassurance: 三天了，它开始习惯你的存在，信任正在一点点建立，你做得很好
followup_questions:
  - 猫咪愿意让你摸了吗？还是只是靠近？
  - 有观察到呼噜声吗？
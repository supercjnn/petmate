day_number: 7
stage_name: 信任建立期
title: 一周小里程碑
focus: 回顾一周进展，调整互动策略
actions:
  - text: 回顾这一周的喂食、排泄、互动情况
    reason: 一周复盘帮助发现规律和问题
  - text: 如果日常习惯稳定，可以尝试短时间轻声说话
    reason: 温和的声音可以建立更深的联系
  - text: 尝试用手拿猫粮或零食，让它从手里取食
    reason: 手喂建立"手=好事"的关联，但注意安全
  - text: 如果它愿意，可以在休息时轻轻抚摸头和背
    reason: 轻柔的抚摸是增进感情的好方式
avoids:
  - text: 不要急于求成，放慢节奏
    reason: 信任建立需要时间，操之过急会适得其反
  - text: 不要强迫互动，尊重它的边界
    reason: 被迫的互动会让猫更想逃离
  - text: 不要让它见到太多陌生人
    reason: 这一周重点是与你的关系建立
observe:
  - 与一周前相比，它有什么变化？
  - 躲藏时间有没有减少？
  - 对你的态度有没有更放松？
risk_tip: 如果一周了还是躲着不出来、不吃不喝，需要考虑是否环境问题或健康问题
shopping_tip: 可以准备一些冻干零食，用于手喂建立信任
reassurance: 一周了！你已经从陌生人变成它每天都能看见、开始依赖的人，这是多大的进步
followup_questions:
  - 回顾这一周，你觉得最大的进步是什么？
  - 有没有什么让你担心的地方？

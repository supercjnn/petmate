day_number: 52
stage_name: 稳定护理期
title: 猫砂选择优化
focus: 找到猫咪最适应的猫砂类型
actions:
  - text: 回顾目前使用的猫砂，观察猫咪接受度
    reason: 猫砂影响猫咪如厕体验和你的清理体验
  - text: 了解不同猫砂类型：豆腐砂、膨润土、水晶砂、混合砂
    reason: 不同类型各有优劣
  - text: 根据猫咪偏好和家庭需求，决定是否调整
    reason: 适合的才是最好的
avoids:
  - text: 不要频繁更换猫砂类型
    reason: 每次更换需要过渡，猫咪需要适应
  - text: 不要只考虑价格或你的喜好
    reason: 猫咪不喜欢的猫砂可能导致乱尿
observe:
  - 猫咪刨砂的积极性
  - 猫砂的粉尘和结团情况
risk_tip: 粉尘大的猫砂可能影响猫咪呼吸道健康
shopping_tip: 可以买小包装试用装测试猫咪对不同猫砂的反应
reassurance: 找到适合的猫砂需要时间，你的耐心探索值得肯定！
followup_questions:
  - 目前用的是什么类型的猫砂？
  - 有没有发现猫咪更喜欢或不喜欢什么？

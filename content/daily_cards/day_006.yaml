day_number: 6
stage_name: 信任建立期
title: 观察排泄习惯
focus: 了解猫咪的如厕规律，确保身体健康
actions:
  - text: 每天固定时间清理猫砂盆，记录尿团和便便数量
    reason: 排泄规律反映健康状况，数据有据可查
  - text: 观察它上厕所的时间偏好（饭后？睡醒？）
    reason: 了解习惯便于及时发现异常
  - text: 继续手指互动，如果有蹭手可以尝试轻摸下巴
    reason: 下巴和脸颊是猫喜欢的被摸区域
  - text: 保持喂食节奏一致，可以在它吃完后静静陪坐
    reason: 吃完后的满足状态是建立联系的好时机
avoids:
  - text: 不要使用强烈香味猫砂或刺激性清洁剂
    reason: 猫的嗅觉敏感，容易不适
  - text: 不要长时间不清理猫砂盆
    reason: 脏猫砂会让猫拒绝使用，甚至憋尿憋屎
  - text: 不要在它上厕所时围观或打搅
    reason: 如厕是脆弱时刻，需要隐私
observe:
  - 每天尿团数量和大小？
  - 便便成形吗？颜色如何？
  - 有没有在上厕所时叫唤或用力？
risk_tip: 尿频但尿少、血尿、便秘或腹泻都需及时就医
shopping_tip: 准备一个小本子或手机备忘录记录每日排泄情况
reassurance: 六天了，你正在成为它生活中最了解它的人，这份细心很重要
followup_questions:
  - 今天清理了多少个尿团？
  - 便便有没有异常（太硬/太软/有血）？

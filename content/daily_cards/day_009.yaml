day_number: 9
stage_name: 信任建立期
title: 建立玩耍节奏
focus: 固定每日玩耍时间，形成规律作息
actions:
  - text: 选择一个固定时间玩耍（建议傍晚或晚饭后）
    reason: 猫晨昏活跃，固定时间帮助形成规律
  - text: 每天玩耍10-15分钟，保持一致性
    reason: 每天短时间玩耍比偶尔长时间更好
  - text: 玩耍后提供食物或零食
    reason: 模拟"捕猎-进食"的自然行为循环
  - text: 玩耍结束时收好玩具，让它知道游戏结束
    reason: 帮助它形成预期，也保护玩具寿命
avoids:
  - text: 不要在它准备睡觉时强行玩耍
    reason: 会破坏其休息节奏
  - text: 不要每次都用同一种玩法
    reason: 变化保持新鲜感和兴趣
  - text: 不要在它害怕时用玩具靠近
    reason: 可能会被解读为威胁
observe:
  - 玩耍时它的瞳孔有没有放大？
  - 有没有伏低身体准备扑的姿势？
  - 玩耍后有没有开始喘气？
risk_tip: 如果玩耍时过度兴奋导致呼吸急促、流口水，需要暂停休息
shopping_tip: 可以准备2-3种不同类型的玩具轮换使用
reassurance: 九天了，你和它开始有了"一起玩"的默契，这是关系更进一步的信号
followup_questions:
  - 今天的玩耍持续了多长时间？
  - 它更喜欢哪种类型的玩具？

day_number: 38
stage_name: 稳定护理期
title: 体外驱虫安排
focus: 了解体外驱虫的重要性和方法
actions:
  - text: 学习跳蚤、蜱虫、螨虫的危害和传播途径
    reason: 理解体外驱虫的必要性
  - text: 掌握体外驱虫药的正确使用位置（后颈皮肤）
    reason: 正确位置才能有效吸收
  - text: 确定体外驱虫频率（通常每月一次）
    reason: 建立规律驱虫节奏
avoids:
  - text: 使用滴剂后不要立即洗澡
    reason: 需要时间渗透吸收
  - text: 不要让猫咪舔到涂药部位
    reason: 药物可能引起不适
observe:
  - 猫咪皮肤有无异常瘙痒
  - 毛发中是否有黑色小颗粒（跳蚤粪便）
risk_tip: 跳蚤会传染绦虫，体外驱虫与体内驱虫需配合进行
shopping_tip: 体外驱虫药可选滴剂或项圈式，滴剂使用更普遍
reassurance: 预防胜于治疗，你的驱虫意识很到位！
followup_questions:
  - 猫咪有没有出门玩耍的经历？
  - 家里有没有其他宠物需要同步驱虫？

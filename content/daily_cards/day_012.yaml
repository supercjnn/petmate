day_number: 12
stage_name: 信任建立期
title: 扩展抚摸区域
focus: 在头部和下巴的基础上，尝试更多安全区域
actions:
  - text: 如果头部抚摸顺利，可以尝试抚摸脸颊两侧
    reason: 脸颊分布腺体，被摸时会分泌费洛蒙让猫放松
  - text: 尝试从头顶顺着背脊线轻抚
    reason: 这是猫咪之间互相理毛的路径
  - text: 观察它的反应，主动蹭你时可以加长时间
    reason: 它的肢体语言是最好的指导
  - text: 边摸边轻声说些鼓励的话
    reason: 温柔语调+触摸=更强的安全感
avoids:
  - text: 不要摸尾巴根部或尾巴本身
    reason: 尾巴非常敏感，多数猫不喜欢被摸
  - text: 不要摸爪子或爪垫
    reason: 爪子是捕猎和自卫工具，高度敏感
  - text: 不要在它专注看别处时摸它
    reason: 突然被打断会让猫不悦
observe:
  - 有没有眯起眼睛或放慢眨眼（"猫式微笑"）？
  - 有没有在你停止抚摸后用头拱你的手？
  - 有没有躺下翻肚皮（即使不建议摸肚皮本身）？
risk_tip: 如果每次摸都会被咬或抓，可能需要更慢的节奏或检查手法
shopping_tip: 正确的抚摸手法本身比任何工具都重要
reassurance: 十二天了，它开始享受你的触碰，这是信任加深的明确信号
followup_questions:
  - 今天尝试抚摸了哪些区域？它的反应如何？
  - 有没有观察到猫咪的"慢眨眼"？

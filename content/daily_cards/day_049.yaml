day_number: 49
stage_name: 稳定护理期
title: 呼吸与体温认知
focus: 了解猫咪正常呼吸和体温范围
actions:
  - text: 学习猫咪正常呼吸频率（休息时约20-30次/分钟）
    reason: 呼吸异常可能是疾病信号
  - text: 了解正常体温范围（38-39.5℃）
    reason: 基础知识帮助判断异常
  - text: 观察猫咪休息时的胸腹起伏
    reason: 了解正常状态才能识别异常
avoids:
  - text: 不要在猫咪兴奋或运动后判断呼吸频率
    reason: 运动后呼吸加快是正常的
  - text: 不要自行给猫咪量体温（除非有经验）
    reason: 肛温测量需要技巧，操作不当可能伤害猫咪
observe:
  - 休息时呼吸是否平稳
  - 有无张嘴呼吸（猫张嘴呼吸通常异常）
risk_tip: 猫咪张嘴呼吸或呼吸急促可能是严重问题，需立即就医
shopping_tip: 无需特别购买，但可以了解宠物医院的位置和急诊时间
reassurance: 了解正常生理指标，让你更有底气判断健康状况！
followup_questions:
  - 猫咪平时呼吸看起来怎么样？
  - 有没有见过猫咪张嘴呼吸？

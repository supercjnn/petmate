day_number: 5
stage_name: 信任建立期
title: 尝试手指互动
focus: 用手指建立初步信任，让它主动靠近你
actions:
  - text: 在它放松时，伸出一根手指，等待它来闻
    reason: 这是猫之间初次见面打招呼的方式
  - text: 如果它用脸蹭你手指，说明它在接纳你
    reason: 蹭是在标记"这是我的人"，是信任的开始
  - text: 继续保持固定的喂食节奏和安静陪伴
    reason: 一致性是建立信任的关键
  - text: 检查猫砂盆使用情况，记录排便频率
    reason: 了解排泄习惯有助于及时发现健康问题
avoids:
  - text: 不要把手指伸到它脸跟前
    reason: 突然靠近会让它害怕，让它主动来闻你
  - text: 不要在它睡觉或躲藏时打扰它
    reason: 打扰它的安全空间会破坏信任
  - text: 不要快速移动或突然发出声音
    reason: 容易触发它的应激反应
observe:
  - 它会主动闻你的手指吗？
  - 呼噜声有没有变得更频繁？
  - 尿团和便便的形状、颜色正常吗？
risk_tip: 如果尿液很少或没有，可能是泌尿问题；如果便便干硬或稀软，需要关注饮食和饮水
shopping_tip: 可以考虑添置一个猫砂铲，方便每日清理
reassurance: 五天了，它开始认识你的气味，这小小的互动是信任的起点
followup_questions:
  - 猫咪有主动闻你吗？
  - 排便次数每天大约几次？

day_number: 27
stage_name: 行为塑造期
title: 咬抓行为的正确引导
focus: 建立玩耍时不咬手的好习惯
actions:
  - text: 始终使用玩具与猫咪互动，不用手脚逗玩
    reason: 防止将人体部位当作玩具
  - text: 如果猫咪咬手，立即停止互动，保持静止
    reason: 让猫咪明白咬=游戏结束
  - text: 等猫咪松开后，用玩具重新引导玩耍
    reason: 告诉猫咪正确的玩耍对象
avoids:
  - text: 不要用手推打猫咪让它松口
    reason: 会让猫咪以为这是互动游戏的一部分
  - text: 不要大声尖叫或做出夸张反应
    reason: 可能让猫咪觉得有趣而加强行为
observe:
  - 猫咪咬抓的触发情境
  - 是否能区分玩耍和攻击行为
  - 对"停止互动"的反应
risk_tip: 如果猫咪攻击性很强，先排除健康问题，再考虑行为调整
shopping_tip: 准备足够多的互动玩具，随时能取代手脚作为玩耍对象
reassurance: 猫咪咬手往往是玩耍过激的表现，学会控制节奏，教会它正确的玩耍方式。
followup_questions:
  - 猫咪有没有咬手或抓人的行为？
  - 什么情况下最容易发生？

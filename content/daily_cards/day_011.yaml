day_number: 11
stage_name: 信任建立期
title: 尝试轻柔抚摸
focus: 从允许触摸到享受抚摸，渐进式建立身体信任
actions:
  - text: 在它放松或吃饭时，尝试轻触头部或下巴区域
    reason: 头部和下巴是猫最接受被摸的部位
  - text: 如果它不躲避，可以慢慢顺着毛发生方向抚摸
    reason: 顺着毛摸舒适，逆着会让猫不适
  - text: 每次抚摸时间从短开始（几秒钟），观察反应后决定是否继续
    reason: 循序渐进，不超出它的接受范围
  - text: 如果它蹭你，说明欢迎，可以适当延长抚摸时间
    reason: 蹭是"继续"的信号，抓住时机加深联系
avoids:
  - text: 不要摸肚子，即使它翻肚皮躺着
    reason: 肚子是猫最脆弱的部位，摸了可能触发攻击
  - text: 不要突然从背后摸它
    reason: 会吓到它，触发防御反应
  - text: 不要在它躲藏或警觉时尝试触摸
    reason: 时机不对会功亏一篑
observe:
  - 它被摸时有没有发出呼噜声？
  - 有没有主动用头蹭你的手？
  - 有没有舔你或轻轻咬你（可能是表达爱意）？
risk_tip: 如果抚摸时猫咪耳朵后压、尾巴剧烈甩动，立即停止，这是被反感的信号
shopping_tip: 准备一把猫咪专用梳子，抚摸同时可以梳理毛发
reassurance: 十一天，当它愿意在你手下放松身体，这是最真的信任表达
followup_questions:
  - 猫咪今天让你摸了吗？摸了哪里？
  - 摸的时候它有什么反应？

day_number: 26
stage_name: 行为塑造期
title: 建立基本行为规范
focus: 设定家中的"可以"和"不可以"
actions:
  - text: 明确列出允许猫咪进入的区域和禁区
    reason: 建立清晰的边界规则
  - text: 对于禁区区域，使用物理阻隔或双面胶
    reason: 用环境引导而非惩罚
  - text: 当猫咪做出希望的行为时，及时给予表扬和奖励
    reason: 强化正确行为
avoids:
  - text: 不要用打、骂、喷水等方式惩罚
    reason: 会破坏信任关系，效果适得其反
  - text: 不要规则不一致（今天可以明天不行）
    reason: 会让猫咪困惑，难以学习
observe:
  - 猫咪对边界的理解程度
  - 是否有试探禁区的行为
  - 对奖励机制的反应
risk_tip: 如果猫咪反复进入禁区，检查阻隔是否有效，而不是增加惩罚
shopping_tip: 准备防跳网、双面胶贴等工具辅助建立边界
reassurance: 规则建立在一致性上。保持耐心，猫咪会慢慢理解哪些地方可以去。
followup_questions:
  - 家里哪些区域需要设为禁区？
  - 猫咪对边界规则的反应如何？
